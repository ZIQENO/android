name: Android release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Fetch verified libXray
        shell: pwsh
        run: ./scripts/fetch-libxray.ps1
      - name: Test and build unsigned APKs
        run: ./gradlew --no-daemon :routing:jvmTest :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-android
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install APK signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-android
          path: unsigned-android
      - name: Sign and verify APKs
        id: signed
        shell: pwsh
        env:
          ZIQENO_SIGNING_KEY_B64: ${{ secrets.ZIQENO_SIGNING_KEY_B64 }}
          ZIQENO_SIGNING_PASSWORD: ${{ secrets.ZIQENO_SIGNING_PASSWORD }}
        run: |
          if (!$env:ZIQENO_SIGNING_KEY_B64 -or !$env:ZIQENO_SIGNING_PASSWORD) {
            throw 'Configure the ZIQENO signing secrets before running this workflow.'
          }
          $key = Join-Path $env:RUNNER_TEMP "ziqeno-${env:GITHUB_RUN_ID}.p12"
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:ZIQENO_SIGNING_KEY_B64))
            Remove-Item Env:ZIQENO_SIGNING_KEY_B64
            $release = ./scripts/prepare-release.ps1 -BuildDir unsigned-android -Destination release-assets -KeyStore $key
            "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key }
          }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.signed.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release or draft $tag already exists. Review any draft before retrying."
            exit 1
          fi
          awk -v heading="## $VERSION" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Missing release notes for $VERSION in CHANGELOG.md."
            exit 1
          fi
          if ! gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null; then
            target="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object | select(.type == "commit") | .sha')"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag does not identify the APK source commit."
              exit 1
            fi
          fi
          gh release create "$tag" release-assets/*.apk release-assets/SHA256SUMS.txt \
            --draft --verify-tag --title "ZIQENO $VERSION" --notes-file release-notes.md
          gh release edit "$tag" --draft=false
